# ============================================
# 固定视角视频人物检测抓拍系统配置
# ============================================

# 视频源：支持本地文件、RTSP 流、摄像头编号
# 示例: "./videos/entrance.mp4" 或 "rtsp://admin:password@192.168.1.100:554/stream1" 或 0 (摄像头)
video_source: "D:\\190准备室\\3#厅 E190 D213准备室_20260818095724\\3#厅 E190 D213准备室_20260814000000-20260814235959_18.mp4"

# 检测参数
detection:
  # 模型选择（由弱到强：n < s < m < l < x）
  # yolov8x.pt = 最精确但最慢，首次运行自动下载
  model: "yolov8n.pt"
  conf_threshold: 0.30           # 置信度阈值（0~1），越高误报越少
  classes: [0]                  # 只检测 person（COCO 数据集中 0=person）
  device: "auto"                # auto=自动检测GPU/CPU，或指定 "cuda:0" / "cpu"
  batch_size: 8                 # 批量推理帧数，1=逐帧推理（兼容旧行为），8=攒8帧一次推理

# 固定视角 ROI（感兴趣区域）
# 只检测多边形区域内的人，减少误检测
# 启用后先裁剪 ROI 外接矩形再送模型，坐标自动映射回原图
roi:
  enabled: true
  points:                       # 多边形顶点，相对坐标 [x, y]，范围 0.0~1.0
    - [0.0, 0.5]
    - [0.5, 0.5]
    - [0.5, 1.0]
    - [0.0, 1.0]

# 截图策略
capture:
  output_dir: "D:\\0814_0817"        # 截图保存根目录
  interval_seconds: 2.0         # 同区域最小截图间隔（秒），用于去重
  min_person_height_px: 80      # 人物框最小高度（像素），过滤远景小人/误检
  save_with_bbox: true          # 截图是否画上检测框和置信度
  max_daily_folder_gb: 10       # 单日文件夹大小上限（GB），超限自动清理旧文件

# 视频处理参数
video:
  resize_width: 960            # 处理分辨率宽度（降低可加速），设为 0 保持原分辨率
  skip_frames: 24                # 基础跳帧数，0=每帧都检测，1=每2帧检测一次
  preview: true                # 是否显示实时预览窗口（生产环境建议 false）
  # 动态自适应跳帧（夜间空场景优化）
  # 连续N批无人检测 → 逐步拉大跳帧（×multiplier），上限 max_skip
  # 一旦检出人 → 立即回退到基础 skip_frames
  dynamic_skip:
    enabled: true
    no_person_threshold: 5       # 连续N批无人后开始拉大跳帧
    sparse_multiplier: 2.0       # 每达到一次阈值，跳帧数×此系数（24→48→96→...）
    max_skip: 50                # 跳帧绝对上限（25fps下约2秒检测一次，防止漏检）

# 结构化输出
# 每个视频生成一份 JSON 结果文件，含人员事件 + 无人段 + 统计摘要
result:
  enabled: true
  output_dir: "./results"        # 结构化结果保存目录

# ==============================================
# 批量任务配置（递归扫描视频文件夹 + 断点续跑）
# ==============================================
batch_task:
  # 视频扫描根目录，会递归遍历所有嵌套子文件夹
  scan_video_root: "D:\\190准备室"
  # 断点任务状态保存文件路径
  task_status_file: "./task_status.json"
  # 识别的视频后缀
  video_suffix: [".mp4", ".avi", ".mov", ".mkv", ".flv"]
  # 并发工作进程数
  # 1 = 单进程（兼容旧行为，主进程加载模型）
  # 2~3 = 多进程并行（每进程独立加载模型，16G显存建议最大3）
  num_workers: 1
